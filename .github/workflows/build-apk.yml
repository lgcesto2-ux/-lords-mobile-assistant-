
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create . --platforms=android --project-name lords_mobile_assistant

      - name: Configure Android desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          if "isCoreLibraryDesugaringEnabled" not in s:
              s, count = re.subn(
                  r'(\bcompileOptions\s*\{)',
                  r'\1\n        isCoreLibraryDesugaringEnabled = true',
                  s,
                  count=1
              )
              if count == 0:
                  raise RuntimeError("compileOptions block not found")

          if "coreLibraryDesugaring(" not in s:
              match = re.search(r'\bdependencies\s*\{', s)
              dependency = '\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
              if match:
                  s = s[:match.end()] + dependency + s[match.end():]
              else:
                  s += '\ndependencies {' + dependency + '\n}\n'

          p.write_text(s)
          print("Desugaring configured successfully.")

          PY

      - name: Organize project files
        run: |
          mkdir -p lib/screens lib/services test
          cp main.dart lib/main.dart
          cp dashboard_screen.dart lib/screens/
          cp events_screen.dart lib/screens/
          cp resources_screen.dart lib/screens/
          cp shields_screen.dart lib/screens/
          cp timers_screen.dart lib/screens/
          cp notification_service.dart lib/services/
          cp storage_service.dart lib/services/
          cp widget_test.dart test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lords-mobile-assistant-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
