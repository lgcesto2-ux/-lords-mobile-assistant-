name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create . --platforms=android --project-name lords_mobile_assistant

              - name: Enable core library desugaring
        run: |
          sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          sed -i '/dependencies {/a\    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' android/app/build.gradle.kts
      - name: Organize project files
        run: |
          mkdir -p lib/screens lib/services test
          cp main.dart lib/main.dart
          cp dashboard_screen.dart lib/screens/
          cp events_screen.dart lib/screens/
          cp resources_screen.dart lib/screens/
          cp shields_screen.dart lib/screens/
          cp timers_screen.dart lib/screens/
          cp notification_service.dart lib/services/
          cp storage_service.dart lib/services/
          cp widget_test.dart test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lords-mobile-assistant-apk
          path: build/app/outputs/flutter-apk/app-release.apk
